<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RED MIND AI — терминалдық ассистент</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0000, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Fira Code', 'Monaco', monospace;
            padding: 1.5rem;
        }

        /* негізгі терминал контейнері */
        .terminal {
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            background: #0b0b0b;
            border: 1px solid #ff1a1a;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3), inset 0 0 10px rgba(255, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(1px);
        }

        /* header – киберпанк стиль */
        .term-header {
            background: #050505;
            padding: 0.9rem 1.8rem;
            border-bottom: 2px solid #ff0033;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ff4d4d, #cc0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        .logo span {
            color: #ff3333;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            text-shadow: 0 0 6px red;
        }

        .status-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #111;
            padding: 5px 14px;
            border-radius: 40px;
            border: 1px solid #ff1a1a;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff4444;
            box-shadow: 0 0 6px #ff0000;
            animation: pulseOnline 1.2s infinite;
        }

        .led.offline {
            background-color: #555;
            box-shadow: none;
            animation: none;
        }

        @keyframes pulseOnline {
            0% { opacity: 0.4; transform: scale(0.9);}
            100% { opacity: 1; transform: scale(1.2);}
        }

        .status-text {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ff6666;
        }

        /* консоль ортасы – хабарлар ағыны */
        .console-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            background: #010101;
            scroll-behavior: smooth;
        }

        /* кастомды скролл (red tech) */
        .console-area::-webkit-scrollbar {
            width: 6px;
        }
        .console-area::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }
        .console-area::-webkit-scrollbar-thumb {
            background: #ff2a2a;
            border-radius: 10px;
        }

        /* әр жол – консоль стилі */
        .message {
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.45;
            border-left: 3px solid transparent;
            padding-left: 12px;
            animation: fadeSlide 0.2s ease-out;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* қолданушы хабары */
        .message.user {
            color: #c0ffb0;
            border-left-color: #2eff7a;
        }
        .message.user::before {
            content: ">";
            color: #2eff7a;
            font-weight: bold;
            margin-right: 12px;
            display: inline-block;
        }

        /* AI жауабы */
        .message.ai {
            color: #f0f0f0;
            border-left-color: #ff3366;
        }
        .message.ai::before {
            content: "⚡";
            color: #ff4d4d;
            margin-right: 10px;
            font-weight: bold;
        }

        /* жүйелік хабар (help, about, error) */
        .message.system {
            color: #ffaa88;
            border-left-color: #ff884d;
            font-style: italic;
        }
        .message.system::before {
            content: "#";
            color: #ff884d;
            margin-right: 10px;
        }

        /* typing эффект кезіндегі жыпылықтайтын курсор */
        .typing-cursor {
            display: inline-block;
            width: 10px;
            height: 16px;
            background-color: #ff3333;
            vertical-align: middle;
            margin-left: 4px;
            animation: blinkCursor 1s step-end infinite;
            box-shadow: 0 0 3px red;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* төменгі input панелі */
        .input-panel {
            background: #0c0c0c;
            border-top: 1px solid #ff1a1a;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .prompt-symbol {
            color: #ff4d4d;
            font-size: 1.3rem;
            font-weight: bold;
            user-select: none;
        }

        .command-input {
            flex: 1;
            background: #000000;
            border: 1px solid #ff3333;
            color: #ffdddd;
            font-family: monospace;
            font-size: 1rem;
            padding: 12px 16px;
            border-radius: 12px;
            outline: none;
            transition: 0.2s;
        }
        .command-input:focus {
            border-color: #ff6666;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }

        button {
            background: #1f0a0a;
            border: 1px solid #ff4d4d;
            color: #ff9999;
            font-family: monospace;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        button:hover {
            background: #ff1a1a;
            color: black;
            border-color: white;
            box-shadow: 0 0 8px red;
        }

        .small-note {
            font-size: 0.7rem;
            color: #aa5555;
            text-align: right;
            padding: 6px 15px;
            background: #030303;
            border-top: 1px dashed #2a0a0a;
        }

        /* мобильдік икемділік */
        @media (max-width: 600px) {
            .terminal {
                height: 95vh;
            }
            .command-input {
                font-size: 0.85rem;
                padding: 10px;
            }
            .logo {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="term-header">
        <div class="logo">
            <span>◉ RED MIND AI</span> :: v1.0
        </div>
        <div class="status-panel">
            <div class="led" id="statusLed"></div>
            <span class="status-text" id="statusLabel">ONLINE</span>
        </div>
    </div>

    <div class="console-area" id="consoleMessages">
        <!-- Хабарлар динамикалық түрде осы жерге қосылады -->
        <div class="message system">
            RED MIND AI терминалына қош келдіңіз. /help — командалар тізімі.
        </div>
        <div class="message system">
            ⚡ Жылдамдық пен минимализм. Enter арқылы сұрақ жіберіңіз.
        </div>
    </div>

    <div class="input-panel">
        <span class="prompt-symbol">❯❯</span>
        <input type="text" id="userInput" class="command-input" placeholder="Сұрағыңызды терисалыңыз... (Enter)" autofocus>
        <button id="sendBtn">Жіберу</button>
        <button id="clearBtn">🗑️ Clear</button>
    </div>
    <div class="small-note">
        ↑ (жоғары көрсеткі) — соңғы сұрақты қайтару • /help, /clear, /about
    </div>
</div>

<script>
    // ---------- ⚡ RED MIND AI — толық функционалды терминалды ассистент ----------
    // OpenAI API кілті (демо режимсіз, нақты жұмыс істейді, бірақ өз кілтіңізді қойыңыз)
    // Төмендегі API_KEY орнына өзіңіздің OpenAI (ChatGPT) кілтін енгізіңіз.
    const API_KEY = "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";  // Плейсхолдер, нақты жұмыс істейді
    
    // GROQ немесе OpenAI сумілдесі – әмбебап ұқсастық үшін OpenAI стиліндегі эндпоинт.
    // Бірақ біз мына API key демо емес, нақты чат комплетциясын қолдайды.
    // API эндпоинт (OpenAI compatible):
    const API_URL = "https://api.openai.com/v1/chat/completions";
    
    // DOM элементтері
    const consoleDiv = document.getElementById("consoleMessages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusLed = document.getElementById("statusLed");
    const statusLabel = document.getElementById("statusLabel");
    
    // Жергілікті сақтау кілті: соңғы 5 сұрақ
    const STORAGE_KEY = "redmind_history";
    
    // Глобалды күй
    let isOnline = true;
    let lastQuestions = [];    // соңғы 5 сұрақты сақтаймыз (тек мәтін)
    let currentTypingElement = null;  // typing эффект кезіндегі уақытша элемент
    let isAwaitingResponse = false;
    
    // -------- Жүйе функциялары ----------
    function updateStatusUI() {
        if (isOnline) {
            statusLed.className = "led online";
            statusLabel.innerText = "ONLINE";
            statusLed.style.background = "#ff4444";
        } else {
            statusLed.className = "led offline";
            statusLabel.innerText = "OFFLINE";
            statusLed.style.background = "#555";
        }
    }
    
    // Желіні тексеру (қарапайым)
    async function checkNetworkAndAPI() {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);
            // Тек API қолжетімділігін тексеру үшін жеңіл шақыру (ешқандай токен жұмсамай, опция)
            // Бірақ API тексеру үшін шынайы шақыру керек емес, интернет байланысын тексерейік
            await fetch("https://httpbin.org/status/200", { mode: "no-cors", signal: controller.signal });
            clearTimeout(timeoutId);
            isOnline = true;
        } catch (e) {
            isOnline = false;
        }
        updateStatusUI();
        return isOnline;
    }
    
    // Соңғы 5 сұрақты localStorage-қа сақтау
    function saveHistory() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(lastQuestions.slice(-5)));
        } catch(e) {}
    }
    
    function loadHistory() {
        try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if(stored) {
                lastQuestions = JSON.parse(stored);
                if(!Array.isArray(lastQuestions)) lastQuestions = [];
            }
        } catch(e) { lastQuestions = []; }
        if(lastQuestions.length > 5) lastQuestions = lastQuestions.slice(-5);
    }
    
    // Жаңа сұрақты тарихқа қосу (тек қолданушы сұрақтары)
    function addToHistory(question) {
        if(!question.trim()) return;
        lastQuestions.push(question.trim());
        if(lastQuestions.length > 5) lastQuestions.shift();
        saveHistory();
    }
    
    // Консольға хабар шығару (printMessage)
    function printMessage(content, type = "ai") {
        // тип: "user", "ai", "system"
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${type}`;
        // HTML ішіндегі қауіпсіз мәтіндік көрсету
        messageDiv.innerHTML = content.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
        consoleDiv.appendChild(messageDiv);
        // автоскролл төмен
        messageDiv.scrollIntoView({ behavior: "smooth", block: "nearest" });
        return messageDiv;
    }
    
    // "Typing..." эффектін көрсету (уақытша)
    function showTypingIndicator() {
        if(currentTypingElement) removeTypingIndicator();
        const typingDiv = document.createElement("div");
        typingDiv.className = "message ai typing-indicator";
        typingDiv.innerHTML = "✦ Ойлау <span class='typing-cursor'></span>";
        consoleDiv.appendChild(typingDiv);
        typingDiv.scrollIntoView({ behavior: "smooth", block: "nearest" });
        currentTypingElement = typingDiv;
        return typingDiv;
    }
    
    function removeTypingIndicator() {
        if(currentTypingElement && currentTypingElement.parentNode) {
            currentTypingElement.remove();
        }
        currentTypingElement = null;
    }
    
    // Қарапайым "типинг" дыбыс эффекті (қысқаша, Web Audio API)
    let audioCtx = null;
    function playTypingSound() {
        try {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.08;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
            osc.stop(audioCtx.currentTime + 0.15);
            audioCtx.resume();
        } catch(e) { /* дыбыс қолжетімсіз болса да бұзбайды */ }
    }
    
    // OpenAI API арқылы нақты жауап алу
    async function fetchAIResponse(userMessage) {
        if(!API_KEY || API_KEY === "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") {
            // Нақты жұмыс істейді, бірақ кілт дұрыс емес болса өзгертіңіз. Демо емес, жай ескерту
            console.warn("API KEY орнатылған, бірақ тиімділік үшін нақты кілт керек");
        }
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 25000);
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [
                        { role: "system", content: "Сіз RED MIND AI — жылдам, минималды әрі cyberpunk стильдегі ассистент. Қысқа, нақты жауап беріңіз. Қазақша немесе пайдаланушы тілінде сөйлесесіз. Терминал мәдениетін сақтаңыз." },
                        { role: "user", content: userMessage }
                    ],
                    temperature: 0.7,
                    max_tokens: 500
                }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            if(!response.ok) {
                const errText = await response.text();
                throw new Error(`API қатесі ${response.status}: ${errText.slice(0,100)}`);
            }
            const data = await response.json();
            const aiReply = data.choices?.[0]?.message?.content || "Жауап алынбады.";
            return aiReply.trim();
        } catch (error) {
            console.error("AI шақыру қатесі:", error);
            if(error.name === "AbortError") throw new Error("Қосылым уақыты өтті (timeout)");
            throw new Error(`API қате: ${error.message}`);
        }
    }
    
    // Негізгі өңдеуші: сұраныс жіберу
    async function handleUserQuery(rawInput) {
        if(isAwaitingResponse) {
            printMessage("⚠️ Алдыңғы сұраныс өңделуде, күте тұрыңыз.", "system");
            return;
        }
        let query = rawInput.trim();
        if(query === "") return;
        
        // 🧠 Командалар жүйесі
        if(query.startsWith("/")) {
            const cmd = query.toLowerCase();
            if(cmd === "/clear") {
                clearChatHistory();
                return;
            } else if(cmd === "/help") {
                printMessage("Қолжетімді командалар:\n/help - көмек\n/clear - чатты тазалау\n/about - жоба туралы\n↑ (көрсеткі) - соңғы сұрақты қайта жіберу\nСоңғы 5 сұрақ автоматты түрде сақталады.", "system");
                return;
            } else if(cmd === "/about") {
                printMessage("RED MIND AI | v2.0 | Терминалды ассистент | Минималды дизайн | OpenAI интеграциясы | Жылдам жауап | Киберпанк стиль | LocalStorage тарихы.", "system");
                return;
            } else {
                printMessage(`Белгісіз команда: ${query}. /help көмегімен танысыңыз.`, "system");
                return;
            }
        }
        
        // Қолданушы хабарын көрсету
        printMessage(query, "user");
        // Тарихқа сақтау
        addToHistory(query);
        
        // Желі тексеру
        await checkNetworkAndAPI();
        if(!isOnline) {
            printMessage("❌ OFFLINE режимі: интернет байланысы жоқ. Кейінірек қайталаңыз.", "system");
            return;
        }
        
        // Typing индикаторын көрсету
        showTypingIndicator();
        playTypingSound(); // қысқа дыбыс эффекті
        
        isAwaitingResponse = true;
        let aiAnswer = "";
        try {
            aiAnswer = await fetchAIResponse(query);
            removeTypingIndicator();
            // Жауапты AI стилімен шығару (алдында ⚡ емес, бірақ css автоматты)
            printMessage(aiAnswer, "ai");
            playTypingSound(); // жауап келгенде қысқа сигнал
        } catch (err) {
            removeTypingIndicator();
            printMessage(`⚠️ AI жауап қатесі: ${err.message}. API кілтін тексеріңіз.`, "system");
            // Статусты offline деп белгілеу уақытша
            isOnline = false;
            updateStatusUI();
            setTimeout(() => { checkNetworkAndAPI(); }, 3000);
        } finally {
            isAwaitingResponse = false;
            userInput.value = "";
            userInput.focus();
        }
    }
    
    // Чатты тазалау (clear)
    function clearChatHistory() {
        // Консоль ішіндегі message жүйесінен басқа бірінші welcome-дан басқасын тазалаймыз
        const messages = consoleDiv.querySelectorAll(".message");
        for(let i = 0; i < messages.length; i++) {
            const msg = messages[i];
            // welcome/system хабарларын сақтамаймыз (толығымен таза)
            msg.remove();
        }
        // Қайтадан қошталу жолдарын қосу
        printMessage("Терминал тазартылды. /help — барлық мүмкіндіктер.", "system");
        printMessage("⚡ RED MIND AI дайын. Сұрағыңызды жазыңыз.", "system");
    }
    
    // Arrow Up: соңғы сұрақты қайтару (localStorage немесе lastQuestions)
    let historyIndexPointer = 0;
    function setupKeyboardShortcuts() {
        userInput.addEventListener("keydown", (e) => {
            if(e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                const val = userInput.value;
                if(val.trim()) handleUserQuery(val);
                else handleUserQuery(val);
            }
            // Arrow up: соңғы сұрақтардан тарту
            if(e.key === "ArrowUp") {
                e.preventDefault();
                if(lastQuestions.length === 0) return;
                if(historyIndexPointer <= 0) historyIndexPointer = lastQuestions.length;
                historyIndexPointer--;
                const prevQuestion = lastQuestions[historyIndexPointer];
                if(prevQuestion) userInput.value = prevQuestion;
                // Курсорды соңына апару
                userInput.setSelectionRange(userInput.value.length, userInput.value.length);
            }
            if(e.key === "ArrowDown") {
                e.preventDefault();
                if(historyIndexPointer < lastQuestions.length - 1) {
                    historyIndexPointer++;
                    userInput.value = lastQuestions[historyIndexPointer];
                } else {
                    historyIndexPointer = lastQuestions.length;
                    userInput.value = "";
                }
            }
        });
    }
    
    // Бастапқы жүктеу, статусты тексеру, тарихты жүктеу
    async function initApp() {
        loadHistory();
        await checkNetworkAndAPI();
        setupKeyboardShortcuts();
        sendBtn.addEventListener("click", () => {
            const q = userInput.value;
            if(q.trim()) handleUserQuery(q);
        });
        clearBtn.addEventListener("click", () => {
            clearChatHistory();
        });
        // Кез келген жерді басқанда фокус
        document.body.addEventListener("click", () => userInput.focus());
        userInput.focus();
        
        // Егер API_KEY демо емес нақты жұмыс істейтін болса — ескерту тек консольге
        if(!API_KEY || API_KEY === "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") {
            printMessage("⚠️ API кілті орнатылған, бірақ нақты жұмыс істеу үшін өзіңіздің OpenAI кілтіңізді енгізіңіз. Қазір сынақ режимінде.", "system");
        } else {
            printMessage("✅ RED MIND AI толық режимде. Сұрақ күтілуде.", "system");
        }
    }
    
    initApp();
</script>
